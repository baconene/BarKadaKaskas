name: Native mobile builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/BarKadaKaskas
    env:
      # Optional repository secret; without it the app falls back to OpenStreetMap.
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      # Optional repository variable; defaults to the production server in build.gradle.kts.
      DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # A stable signing key lets people install new versions over old ones. Without the secrets the
      # APK is signed with a throwaway debug key and must be uninstalled before installing a newer one.
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "::warning title=Android signing::ANDROID_KEYSTORE_BASE64 is not set, so the APK uses a debug key and cannot update an earlier install. See docs/mobile-development.md."
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi
      - name: Build and test APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          task="assemble${VARIANT^}"
          ./gradlew testDebugUnitTest "$task" --no-daemon --stacktrace 2>&1 | tee gradle.log
          mkdir -p dist
          cp "app/build/outputs/apk/$VARIANT/BarkadaKasKas-$VARIANT.apk" dist/BarkadaKasKas.apk
      # Turn Kotlin/Gradle errors into annotations so they are visible without opening the log.
      - name: Report build errors
        if: failure()
        run: |
          sed -nE 's#^e: file://([^:]+):([0-9]+):([0-9]+) (.*)#\1|\2|\3|\4#p' gradle.log | head -50 | while IFS='|' read -r file line col msg; do
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=$line,col=$col::$msg"
          done
          awk '/What went wrong:/{f=1;n=0} f{print; if(++n>6) f=0}' gradle.log | head -40 | sed 's/^/::error title=Gradle::/'
      - uses: actions/upload-artifact@v4
        with:
          name: BarkadaKasKas-APK
          path: android/BarKadaKaskas/dist/BarkadaKasKas.apk
          if-no-files-found: error
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/BarKadaKaskas/gradle.log

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/BarKadaKaskas
    steps:
      - uses: actions/checkout@v5
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      # Unsigned device build: installable with Sideloadly/AltStore, which sign it with the user's own Apple ID.
      - name: Build for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild -project BarKadaKaskas.xcodeproj -scheme BarKadaKaskas -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=0.1.${{ github.run_number }} build 2>&1 | tee xcodebuild.log
      # Turn Swift compiler errors into annotations so they are visible without opening the log.
      - name: Report build errors
        if: failure()
        run: |
          grep -E '^/.+\.swift:[0-9]+:[0-9]+: error: ' xcodebuild.log | sort -u | head -50 | while IFS= read -r entry; do
            file=$(echo "$entry" | cut -d: -f1); line=$(echo "$entry" | cut -d: -f2); col=$(echo "$entry" | cut -d: -f3); msg=$(echo "$entry" | cut -d: -f5-)
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=$line,col=$col::$msg"
          done
          grep -E 'error: ' xcodebuild.log | grep -vE '\.swift:[0-9]+' | sort -u | head -10 | sed 's/^/::error title=Xcode::/'
      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/BarKadaKaskas.app dist/Payload/
          (cd dist && zip -qry BarkadaKasKas.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: BarkadaKasKas-IPA
          path: ios/BarKadaKaskas/dist/BarkadaKasKas.ipa
          if-no-files-found: error
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/BarKadaKaskas/xcodebuild.log

  # One release per build with both apps. The landing page links to
  # releases/latest/download/BarkadaKasKas.apk and .ipa, so the newest build is always one tap away.
  release:
    needs: [android, ios]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BarkadaKasKas-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v0.1.${{ github.run_number }}
          name: BarkadaKasKas 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/BarkadaKasKas.apk
            dist/BarkadaKasKas.ipa
          body: |
            Built from ${{ github.ref_name }} (${{ github.sha }}). Not on Google Play or the App Store; this page is the official download.

            **Android:** download `BarkadaKasKas.apk` on your phone, open it, allow "Install unknown apps" for your browser if asked, then tap Install.

            **iPhone:** `BarkadaKasKas.ipa` is unsigned. Install it with [Sideloadly](https://sideloadly.io) or [AltStore](https://altstore.io) on a computer, signing in with your own Apple ID. With a free Apple ID the app must be refreshed every 7 days (AltStore can do this automatically).
