name: tests

on:
  push:
    branches:
      - develop
      - main
      - 'codex/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Publish Ziggy Configuration
        run: php artisan ziggy:generate

      - name: Build Assets
        run: npm run build

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Tests
        run: |
          set -o pipefail
          ./vendor/bin/phpunit 2>&1 | tee phpunit.log

      # Publish the failure summary as an annotation so it is readable without opening the log.
      - name: Report test failures
        if: failure()
        run: |
          summary=$(awk '/^There (was|were) [0-9]+ (failure|error)/{f=1} f' phpunit.log | head -c 3500)
          [ -z "$summary" ] && summary=$(tail -c 3500 phpunit.log)
          summary=${summary//'%'/'%25'}
          summary=${summary//$'\n'/'%0A'}
          echo "::error title=PHPUnit failures::$summary"
