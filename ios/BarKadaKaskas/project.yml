name: BarKadaKaskas
options:
  bundleIdPrefix: com.barkadakaskas
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BarKadaKaskas:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barkadakaskas.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BarKadaKaskas
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Show where you are on the trip map.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your development server on the local network.
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
